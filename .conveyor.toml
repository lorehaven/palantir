# Every push to master, and every pull request.
on = { push = ["master"], pull_request = ["*"] }

[[stage]]
name = "check"

[[stage.job]]
name  = "format"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "format --check" }]

[[stage.job]]
name    = "lint"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
timeout = 1800
steps   = [{ anvil = "lint --all-targets --deny-warnings" }]

[[stage.job]]
name    = "deps"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
timeout = 1800
steps   = [{ anvil = "machete" }, { anvil = "audit" }]

[[stage]]
name  = "build"
needs = ["check"]

[[stage.job]]
name    = "server"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
timeout = 3600
steps = [
    "command -v sass >/dev/null || npm install -g sass",
    "mkdir -p dist/assets/css",
    "sass --no-source-map styles/main.scss dist/assets/css/palantir.css",
    "cargo build --release -p server",
]

[[stage]]
name  = "test"
needs = ["build"]

[[stage.job]]
name    = "unit"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
timeout = 1800
steps   = [{ anvil = "test --all" }]
