# Every push to master, and every pull request.
on = { push = ["master"], pull_request = ["*"] }

[[stage]]
name = "check"

[[stage.job]]
name  = "format"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "format --check" }]

[[stage.job]]
name    = "lint"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
timeout = 1800
steps   = [{ anvil = "lint --all-targets --deny-warnings" }]

[[stage.job]]
name    = "deps"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
timeout = 1800
steps   = [{ anvil = "machete" }, { anvil = "audit" }]

[[stage]]
name  = "build"
needs = ["check"]

[[stage.job]]
name    = "leptos"
image   = "rust:1.94"
timeout = 3600
env     = { LEPTOS_SASS_VERSION = "1.71.0" }
steps = [
    "rustup target add wasm32-unknown-unknown",
    "command -v cargo-leptos >/dev/null || cargo install --locked cargo-leptos",
    "cargo leptos build --release",
]

[[stage]]
name  = "test"
needs = ["build"]

[[stage.job]]
name    = "unit"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
timeout = 1800
steps   = [{ anvil = "test --all" }]

[[stage]]
name  = "image"
needs = ["test"]
when  = "branch == 'master' && event != 'pull_request'"

[[stage.job]]
name    = "docker"
timeout = 3600
env     = { IMAGE = "ossiriand.arda:8080/forge/palantir/palantir", CARGO_REGISTRIES_ENNOR_INDEX = "sparse+https://ennor.ddns.net/warehouse/index/" }
secrets = ["CARGO_REGISTRIES_ENNOR_TOKEN"]
steps = [
    "docker buildx build --build-arg CARGO_REGISTRIES_ENNOR_INDEX --build-arg CARGO_REGISTRIES_ENNOR_TOKEN -t palantir .",
    "docker tag palantir $IMAGE:$CONVEYOR_SHA",
    "docker tag palantir $IMAGE:latest",
    "docker push $IMAGE:$CONVEYOR_SHA",
    "docker push $IMAGE:latest",
]
